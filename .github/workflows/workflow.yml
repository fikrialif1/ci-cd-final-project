name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up job
      run: echo "Initializing job"

    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"

    - name: Install dependencies
      run: |
        pip install flake8 nose

    - name: Lint
      run: |
        flake8 .

    - name: Run unit tests
      run: |
        nosetests

    - name: Complete job
      run: echo "Done"
